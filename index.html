<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>UPSSSC Online Registration Form</h1>

    <form>
        <div class="row">
            <div class="input-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter full name" required>
            </div>

            <div class="input-box">
                <label>Father's Name</label>
                <input type="text" placeholder="Enter father's name" required>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Mother's Name</label>
                <input type="text" placeholder="Enter mother's name" required>
            </div>

            <div class="input-box">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Gender</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="input-box">
                <label>Email ID</label>
                <input type="email" placeholder="Enter email" required>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter mobile number" required>
            </div>

            <div class="input-box">
                <label>Aadhaar Number</label>
                <input type="text" placeholder="Enter Aadhaar number" required>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Category</label>
                <select required>
                    <option value="">Select Category</option>
                    <option>General</option>
                    <option>OBC</option>
                    <option>SC</option>
                    <option>ST</option>
                </select>
            </div>

            <div class="input-box">
                <label>Qualification</label>
                <input type="text" placeholder="Enter qualification" required>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Exam Center</label>
                <select required>
                    <option value="">Select Center</option>
                    <option>Lucknow</option>
                    <option>Noida</option>
                    <option>Kanpur</option>
                    <option>Meerut</option>
                </select>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Create password" required>
            </div>
        </div>

        <div class="full-box">
            <label>Address</label>
            <textarea rows="4" placeholder="Enter full address" required></textarea>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Upload Photo</label>
                <input type="file" required>
            </div>

            <div class="input-box">
                <label>Upload Signature</label>
                <input type="file" required>
            </div>
        </div>

        <button type="submit">Register Now</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
